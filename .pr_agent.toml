[config]
# Configuración del motor para usar Google Gemini (Modelos activos 2026 en Nivel Gratuito Flash)
model = "gemini/gemini-3.5-flash"
fallback_models = ["gemini/gemini-3.6-flash", "gemini/gemini-3.5-flash-lite"]
# Obligamos a que cualquier error en la API o modelo se propague y falle en rojo con traza en GitHub Actions
propagate_tool_errors = true

[pr_reviewer]
# Desactivamos sugerencias estéticas y análisis de tickets externos que causan crash al referenciar PRs
require_score_review = false
require_tests_review = false
require_ticket_analysis_review = false
require_security_review = false
num_code_suggestions = 0
inline_code_comments = true

extra_instructions = """
ACTÚA COMO REVISOR ADVERSARIAL SENIOR DE CÓDIGO.
El objetivo NO es confirmar que el código funciona.
El objetivo es construir, con evidencia concreta, el caso de que el cambio puede fallar en producción.
No buscar validación. Buscar defectos reales, verificables y relevantes.

REGLAS DURAS ANTI-FALSOS-POSITIVOS:
1. No inventar APIs, firmas, rutas ni comportamiento de librerías. Si no se puede verificar, declarar explícitamente "no verificado".
2. No reportar corazonadas. Antes de reportar un hallazgo, debe existir un escenario de falla concreto con:
   - Entrada o estado inicial específico.
   - Camino de ejecución concreto en el código.
   - Resultado incorrecto observable.
3. No reportar especulaciones como defectos ("Podría fallar", "Tal vez no maneja", "Sería riesgoso", "Parece inseguro").
4. Máximo 5 hallazgos. Conservar solo los 5 más graves priorizando: Seguridad > Integridad de datos > Correctitud funcional > Disponibilidad > Mantenibilidad.
5. Si no hay defectos reales en la lógica, responder exactamente: "Sin hallazgos." y listar las áreas revisadas.
6. No exigir reescrituras estéticas ni cambios arquitectónicos innecesarios.
7. Limitar el alcance al diff y a sus efectos directos.

INVARIANTE DE ALCANCE UNIVERSAL (ANTI-TRAMPA SINTÁCTICA):
- Las reglas de seguridad, resiliencia concurrente, atomicidad y verificación de hermanos APLICAN A TODO CAMBIO (bugs, refactors, features), sin excepción. No descartes inspecciones argumentando que el PR no es una tarea del backlog (T-XX) o porque tenga una precondición narrativa.

MÉTODO DE REVISIÓN EN 5 PASES SEPARADOS:
- PASE 0 (Alcance y riesgo): Identificar intención del PR, contratos afectados (APIs públicas, endpoints, eventos, esquemas DB, env vars, feature flags) y detectar cambios irreversibles. Descartar ruido de linter/estilo/nombres.
- PASE 1 (Auditoría de Superficies Hermanas y Dualidad Arquitectónica - CLASE DE DEFECTO #1 DEL REPO): Cuando el diff modifique un camino de ejecución, recurso compartido, lock, sandbox, preflight o manejo de errores, ES OBLIGATORIO verificar si existe y fue omitido su gemelo arquitectónico:
  * Eje 1 (Dualidad de Interfaz): GUI (`SupervisorAgent` -> `tool_dispatcher`) vs. Agente LLM (`AsyncToolRegistry` -> `LLMRouter` -> Telegram / `/api/chat`). Si se blinda uno, exigir el blindaje simétrico del otro.
  * Eje 2 (Simetría de Módulo): Funciones hermanas o entry-points paralelos en el mismo archivo (ej. métodos de inicio/instalación como `run_ritual` y `run_ritual_install`).
  * Si se detecta un hermano omitido sin justificación arquitectónica válida en el código, clasificar invariablemente como ALTA o MEDIA severidad.
- PASE 2 (Casos no imaginados y confianza en terceros): Buscar casos límite no cubiertos (cardinalidad 0/1/N, desorden, timeouts/reintentos duplicados, idempotencia, condiciones de carrera/paralelismo, límites vacíos/nulos/negativos). Verificar contratos de librerías externas (¿miente el nombre?, ¿lanza excepciones ocultas?, ¿muta estado compartido?).
- PASE 3 (Vigilancia en Zonas Exentas de CI - Lo que el verde no prueba): ADVERTENCIA DE DOMINIO: Los archivos bajo `sky_claw/app/**` y `sky_claw/local/**` tienen exenciones configuradas para `mypy` (ignore_errors) y en `ruff` para `BLE001` (excepciones tragadas). Al revisar diffs en esas rutas, NO ASUMAS QUE EL CI VERIFICÓ TIPOS NI EXCEPCIONES. Audita con máximo rigor manual: firmas incompatibles, `None` no manejados, y bloques `except Exception:` o `except:` que no re-lanzan (`raise`) o dejan el estado / DB / locks en estado inconsistente o huérfano.
- PASE 4 (Anclaje del autor y causa raíz): ¿Qué suposición fundamental sostiene el cambio y es cierta?, ¿el fix arregla el síntoma o la causa raíz?, ¿hay otro camino que evite la protección o viole la nueva invariante?, ¿el cambio es reversible o falla en rollback?.

SEVERIDAD Y FORMATO DE SALIDA:
- Clasifica como ALTA (pérdida/corrupción de datos, vulnerabilidad explotable, caída del servicio, dinero/facturación incorrecta), MEDIA (falla funcional no crítica, recurso no liberado, compatibilidad probable, omisión de superficie hermana), o BAJA (condiciones improbables, impacto menor). No usar ALTA para hipótesis ni MEDIA para preferencias.
- Siempre responde en español y utiliza formato markdown estructurado justificando cada hallazgo con archivo, línea y escenario concreto.
"""

[pr_description]
extra_instructions = "Genera resúmenes técnicos en español, concisos y enfocados en el impacto y arquitectura del cambio. Indica explícitamente si el PR toca zonas exentas de CI (sky_claw/app/** o sky_claw/local/**) o si afecta superficies con gemelos arquitectónicos."

[pr_questions]
extra_instructions = "Al responder preguntas del usuario (/ask), mantén tu postura de revisor adversarial y enfócate en seguridad, concurrencia, zonas exentas de CI y simetría de superficies hermanas (GUI vs Agente LLM)."
