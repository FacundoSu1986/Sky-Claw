version: 2

updates:
  # Python application + development dependencies declared at repository root.
  # Minor/patch updates are grouped to limit PR noise; major updates remain
  # independent so compatibility changes receive explicit review.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"

  # Node.js Telegram gateway. package-lock.json is committed, so Dependabot can
  # update the manifest and lockfile together and CI validates with npm ci/audit.
  - package-ecosystem: npm
    directory: "/sky_claw/app/comms/telegram_gateway_node"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 5
    groups:
      node-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"

  # Keep SHA-pinned GitHub Actions current without weakening immutable-action
  # pinning. Dependabot updates the SHA and its associated version comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
