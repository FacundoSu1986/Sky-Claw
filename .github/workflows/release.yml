name: Release

# Pausado temporalmente mientras el proyecto atraviesa refactors mayores.
# Restaurar el trigger por tags y quitar el guard del job cuando se reanuden los releases.
on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false  # never cancel an in-flight release

permissions:
  contents: write   # create GitHub Release + upload assets
  id-token: write   # required by cosign OIDC signing

jobs:
  release:
    if: ${{ false }}  # pausado intencionalmente; conservar intacta la receta de release
    name: "📦 Release ${{ github.ref_name }}"
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # hatch-vcs needs full history to resolve the tag

      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          pip install hatch-vcs hatchling pyinstaller
          pip install -e .

      - name: Verify version matches tag
        shell: pwsh
        run: |
          $ver = python -c "import importlib.metadata; print(importlib.metadata.version('sky-claw'))"
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if ($ver -ne $tag) {
            Write-Error "Version mismatch: package=$ver tag=$tag"
            exit 1
          }
          Write-Host "Version verified: $ver"

      - name: Build executable
        run: pyinstaller sky_claw.spec --clean

      # ── SBOM (Software Bill of Materials) ────────────────
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          artifact-name: sky-claw-${{ github.ref_name }}-sbom.spdx.json
          output-file: sky-claw-${{ github.ref_name }}-sbom.spdx.json
          path: dist/
          upload-release-assets: false  # action-gh-release handles the upload below

      # ── Signing (cosign keyless via OIDC) ─────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign executable
        shell: pwsh
        run: |
          cosign sign-blob dist/SkyClawApp.exe `
            --yes `
            --bundle dist/SkyClawApp.exe.bundle.json

      # ── GitHub Release ────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/SkyClawApp.exe
            dist/SkyClawApp.exe.bundle.json
            sky-claw-${{ github.ref_name }}-sbom.spdx.json
