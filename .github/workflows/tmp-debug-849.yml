# TEMPORAL — diagnóstico de la suite Windows para el PR #849. Se borra antes de mergear.
name: tmp-debug-849

on:
  push:
    branches: ["arena/d71c5733-sky-claw"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tmp-debug-849
  cancel-in-progress: true

jobs:
  debug:
    name: "tmp debug (windows)"
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Run full suite
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=line --timeout=600 tests/ > out.txt 2>&1
          echo "EXIT=$?" >> out.txt
          {
            echo 'Diagnóstico temporal de la suite Windows COMPLETA (PR #849). Se borra este workflow antes de mergear.'
            echo
            echo '```'
            tail -c 55000 out.txt
            echo '```'
          } > comentario.txt
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh pr comment 849 --body-file comentario.txt || true
          exit 1
