name: VFS supervision sandbox (Windows)

# Laboratorio AISLADO y descartable para el fence de supervisión del broker MO2/USVFS.
# Corre en un runner efímero de GitHub: NO toca ningún rig, backup, perfil, mod ni MO2 real,
# y los únicos procesos que lanza son python.exe durmiendo, un ejecutable mínimo construido
# acá y SkyClawApp.exe con --vfs-probe-child (lee un archivo temporal y devuelve su hash).
# No ejecuta TexGen, DynDOLOD ni Skyrim.
#
# Responde con evidencia del sistema operativo lo que las pruebas sintéticas del protocolo
# no pueden: qué contiene realmente un Job Object y si el proceso que ejecuta Python en el
# ejecutable PyInstaller onefile pertenece al Job al que se asignó el proceso lanzado.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "sky_claw/local/mo2/**"
      - "scripts/windows_job_probe.py"
      - "scripts/windows_onefile_census.py"
      - "scripts/windows_spawn_origin.py"
      - "tests/test_windows_onefile_census.py"
      - "tests/test_vfs_job_identity*.py"
      - "tests/test_vfs_job_containment_windows.py"
      - "tests/test_mo2_bridge_breakaway_job_real_windows.py"
      - "tests/test_vfs_fence_de_supervision.py"
      - "tests/test_vfs_fence_e2e_proceso_real.py"
      - ".github/workflows/vfs-supervision-sandbox.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sandbox:
    name: "🔬 Supervisión VFS (Windows, sandbox) / py3.11"
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # los pasos posteriores instalan dependencias de terceros
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias de desarrollo y PyInstaller
        run: |
          pip install -e ".[dev]"
          pip install pyinstaller
          pip install wmi==1.5.1 pywin32==306

      - name: Preparar carpeta de resultados
        run: New-Item -ItemType Directory -Force sandbox_min | Out-Null

      - name: "Job Objects reales y protocolo (-rA: un SKIPPED no es un PASS)"
        run: >
          pytest -v -rA -p no:cacheprovider
          tests/test_windows_onefile_census.py
          tests/test_vfs_job_identity_windows.py
          tests/test_vfs_job_identity_e2e_windows.py
          tests/test_vfs_job_identity.py
          tests/test_vfs_job_identity_broker.py
          tests/test_vfs_job_identity_bridge.py
          tests/test_vfs_job_identity_anclas.py
          tests/test_mo2_bridge_worker_argv.py
          tests/test_vfs_job_containment_windows.py
          tests/test_mo2_bridge_breakaway_job_real_windows.py
          tests/test_vfs_fence_de_supervision.py
          tests/test_vfs_fence_e2e_proceso_real.py
          2>&1 | Tee-Object -FilePath sandbox_min\pytest.txt

      - name: Origen de los procesos que crea el arranque del intérprete (hook de auditoría, Python de desarrollo)
        if: ${{ !cancelled() }}
        run: python -m scripts.windows_spawn_origin --json sandbox_min\resultados_origen.json

      - name: Ejecutable mínimo onefile (réplica de las opciones del spec) - construir
        if: ${{ !cancelled() }}
        run: |
          Set-Content -Path sandbox_min\dormilon.py -Value "import time`ntime.sleep(6)"
          pyinstaller --onefile --noconsole --name MinimoOnefile --distpath sandbox_min\dist --workpath sandbox_min\build --specpath sandbox_min sandbox_min\dormilon.py
      - name: Ejecutable mínimo onefile - medir pertenencia al Job según el retardo de asignación
        if: ${{ !cancelled() }}
        run: >
          python -m scripts.windows_job_probe --exe sandbox_min\dist\MinimoOnefile.exe
          --retardos 0,0.05,0.2,0.5,1,2 --repeticiones 5 --ventana 14 --json sandbox_min\resultados.json

      - name: Ejecutable mínimo onefile - censo EXACTO (IOCP + WMI) y supervivientes tras terminar el Job
        if: ${{ !cancelled() }}
        run: >
          python -m scripts.windows_onefile_census --exe sandbox_min\dist\MinimoOnefile.exe
          --retardos 0,0.05,0.5,2 --repeticiones 3 --ventana 14 --terminar-tras 1.5 --json sandbox_min\resultados_censo_min.json

      - name: SkyClawApp.exe real (pyinstaller sky_claw.spec) - construir
        if: ${{ !cancelled() }}
        run: pyinstaller sky_claw.spec --clean
      - name: SkyClawApp.exe CONGELADO - identidad del Job de punta a punta (assign a tiempo y assign tardío)
        if: ${{ !cancelled() }}
        env:
          SKYCLAW_FROZEN_EXE: dist\SkyClawApp.exe
        run: >
          pytest -v -rA -p no:cacheprovider
          tests/test_vfs_job_identity_e2e_windows.py
          2>&1 | Tee-Object -FilePath sandbox_min\pytest_congelado.txt

      - name: SkyClawApp.exe real - medir pertenencia al Job con --vfs-probe-child (inocuo)
        if: ${{ !cancelled() }}
        run: >
          python -m scripts.windows_job_probe --exe dist\SkyClawApp.exe
          '--arg=--vfs-probe-child' '--arg={probe_file}' '--arg={probe_sha}'
          --retardos 0,0.5,1,2,4 --repeticiones 3 --ventana 40 --json sandbox_min\resultados_real.json

      - name: SkyClawApp.exe real - censo EXACTO del arranque (IOCP + WMI) con --vfs-probe-child (inocuo)
        if: ${{ !cancelled() }}
        run: >
          python -m scripts.windows_onefile_census --exe dist\SkyClawApp.exe
          '--arg=--vfs-probe-child' '--arg={probe_file}' '--arg={probe_sha}'
          --retardos 0,0.5,1,2 --repeticiones 3 --ventana 40 --json sandbox_min\resultados_censo_real.json

      - name: SkyClawApp.exe real - terminar el Job con el árbol VIVO (un escapado del Job, ¿sobrevive al cancel?)
        if: ${{ !cancelled() }}
        run: >
          python -m scripts.windows_onefile_census --exe dist\SkyClawApp.exe
          '--arg=--vfs-probe-child' '--arg={probe_file}' '--arg={probe_sha}'
          --retardos 1,2,3 --repeticiones 3 --ventana 40 --terminar-tras 0.5 --json sandbox_min\resultados_censo_real_terminado.json

      - name: Resumen compacto (lo que importa, al final del log)
        if: always()
        run: |
          Write-Output "=== pytest (PASSED/FAILED/SKIPPED/XFAIL/ERROR) ==="
          if (Test-Path sandbox_min\pytest.txt) { Select-String -Path sandbox_min\pytest.txt -Pattern '^(PASSED|FAILED|SKIPPED|ERROR|XFAIL|XPASS) |^=+ .*(passed|failed|skipped|error)|HALLAZGO' | ForEach-Object { $_.Line } }
          if (Test-Path sandbox_min\pytest_congelado.txt) { Write-Output "=== pytest con el ejecutable CONGELADO ==="; Select-String -Path sandbox_min\pytest_congelado.txt -Pattern '^(PASSED|FAILED|SKIPPED|ERROR|XFAIL|XPASS) |^=+ .*(passed|failed|skipped|error)' | ForEach-Object { $_.Line } }
          foreach ($f in @('sandbox_min\resultados.json','sandbox_min\resultados_real.json')) {
            if (Test-Path $f) { Write-Output "=== $f ==="; python -m scripts.windows_job_probe --resumir $f }
          }
          foreach ($f in @('sandbox_min\resultados_censo_min.json','sandbox_min\resultados_censo_real.json','sandbox_min\resultados_censo_real_terminado.json')) {
            if (Test-Path $f) { Write-Output "=== $f ==="; python -m scripts.windows_onefile_census --resumir $f }
          }
          if (Test-Path sandbox_min\resultados_origen.json) {
            Write-Output "=== origen de los procesos del arranque ==="
            python -m scripts.windows_spawn_origin --resumir sandbox_min\resultados_origen.json
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vfs-supervision-sandbox-resultados
          path: |
            sandbox_min/resultados*.json
            sandbox_min/pytest.txt
          if-no-files-found: warn
