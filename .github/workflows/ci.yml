name: Sky-Claw CI/CD

on:
  # Solo main/master en push: antes se agrupaba por github.ref (refs/heads vs
  # refs/pull/N/merge) y las ramas con PR disparaban la matriz dos veces sin
  # cancelarse entre sí. Ahora la concurrencia se diferencia por evento:
  # en push se aísla por github.sha (sin cancelarse entre commits distintos de main),
  # mientras que en pull_request se agrupa por el ref del PR con cancelación
  # en progreso. Mantener push restringido a main/master evita duplicación en
  # feature branches y reserva runners Windows para certificación de integración.
  push:
    branches: [main, master]
  # pull_request sin filtro de branches: corre en todo PR, incluyendo stacked
  # (base = feature branch). Como push ya no dispara en feature, no hay
  # duplicación. Cubre el caso señalado en revisión (PR a feature sin CI).
  pull_request:
  # Corrida completa nocturna sobre main (07:00 UTC = 04:00 en Argentina, fuera del horario de los PRs): detecta lo que
  # ningún commit cambió (una dependencia nueva que pip resuelve distinto, como el ruff 0.17.4 de CI-FIX-003, o un test
  # inestable). Si falla, avisa el job `alerta-main`. Concurrencia: como push, agrupa por SHA y no cancela.
  schedule:
    - cron: "0 7 * * *"
  # A pedido (Actions → Run workflow): la suite completa sobre cualquier rama, p. ej. para probar py3.12 antes del merge.
  # Sobre una rama que no es main, un rojo no dispara la alerta.
  workflow_dispatch:

concurrency:
  # En pull_request: un push nuevo cancela la corrida obsoleta del mismo PR
  # (mismo ref `refs/pull/N/merge`), ahorrando runners Windows de 40+ min.
  # En push (main/master): cada commit tiene su propio grupo por SHA y NO
  # se cancelan entre sí (`cancel-in-progress: false`). Esto evita que merges
  # sucesivos a main aborten la certificación y dejen 'Tests (Pytest)' en
  # estado fallido ('Test matrix failed: cancelled/abandoned').
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# CI-FIX-001: Opt into Node.js 24 now — Node.js 20 actions are deprecated
# and will be forced off on 2026-06-02 and removed 2026-09-16.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Gate 1: Code Quality ─────────────────────────────────────
  # Una sola vez y en Ubuntu: ruff no depende de la plataforma ni del intérprete (versión fijada en `dev`,
  # `target-version = "py311"` y `*.py` con `eol=lf` en .gitattributes). Antes corría dos veces en Windows y ocupaba dos
  # de los 20 slots simultáneos de GitHub Free que comparten TODAS las corridas del repo. Mypy, en cambio, sí depende
  # de la plataforma (estrecha las ramas `sys.platform`) y se queda en Windows. Ancla: tests/test_ci_platform_policy.py.
  lint:
    name: "🔍 Lint (Ruff) / ubuntu"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      # CI-FIX-002: Install ruff via dev extras for version consistency with
      # local dev environment. Avoids silent format drift caused by unpinned
      # `pip install ruff` resolving to a different minor/patch than local.
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check sky_claw/ scripts/ tests/ --output-format=github
      - name: Ruff format check
        run: ruff format --check sky_claw/ scripts/ tests/

  # ── Gate 2: Type Safety ───────────────────────────────────────
  typecheck:
    name: "🏷️ Type Check (Mypy) / py${{ matrix.python-version }}"
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Mypy check
        run: python -m mypy sky_claw/ scripts/ --ignore-missing-imports --no-error-summary

  # ── Gate 3: Test Suite ───────────────────────────────────────
  # La suite completa de Windows se reparte en shards: en un solo job tardaba 50-72 min y cada push de cada PR
  # reiniciaba esa espera. Cada shard colecta la suite ENTERA con pytest y corre solo los archivos que le tocan
  # (`scripts/ci_particion.py`, activado con SKYCLAW_SHARD): no hay una lista de archivos que mantener, y un
  # subdirectorio nuevo de tests queda cubierto por construcción.
  #
  # Repartir tiene un modo de falla silencioso: que un test no corra en NINGÚN shard (un shard de menos en la matriz,
  # una colección que cambia entre jobs). Ningún job falla y el verde miente. Por eso el job `test` de más abajo no se
  # limita a esperar: exige, con los manifiestos que deja cada shard, que entre todos hayan seleccionado EXACTAMENTE la
  # suite (misma huella, mismo total, sin archivos repetidos, suma de tests igual al total colectado). La cantidad de
  # shards vive en tres lugares (la matriz, SKYCLAW_SHARD y el --total del verificador) y
  # tests/test_ci_platform_policy.py los ata al mismo número.
  #
  # 2026-11-21 (medido con `gh api` sobre 16 corridas): sin cola, la corrida tardaba 18-22 min; el freno real era el tope
  # de 20 jobs simultáneos de GitHub Free, compartido por TODAS las corridas, y cada corrida lanzaba 14 a la vez. Dos
  # cambios: (1) el reparto pasa a ser por DURACIÓN medida (scripts/ci_duraciones.json; por conteo, el shard más lento
  # tardaba 905 s de 2616) y a 6 shards; (2) en pull_request corre solo py3.11, el intérprete con el que Build y Release
  # congelan el ejecutable. py3.12 se sigue certificando en CADA push a main (y en todo evento que no sea un PR): una
  # regresión que solo aparezca en 3.12 se ve después del merge, no antes. El ancla enumera los disparadores reales.
  test-shard:
    name: "🧪 Shard ${{ matrix.shard }}/6 / py${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    # 2026-10-09: 30 min era insuficiente. Medido en las corridas recientes, pytest
    # tarda 1057-1719 s segun el runner asignado (py3.11 es el volatil; py3.12 se
    # mantiene en 1334-1392 s) y el job suma ~90 s de instalacion. Con 30 min quedo
    # al 88-96 % del limite en 6 de 8 corridas muestreadas y se cancelo aunque el
    # paso de tests habia devuelto 0. 40 min deja el peor caso observado al 76 %.
    # 2026-10-22: 40 min dejo de alcanzar porque la suite crecio. Pytest ya tarda
    # 1829-2322 s y varia segun el runner en las dos versiones (py3.11: 1829 y
    # 2322 s; py3.12: 1852 y 2165 s), y el job suma ~80 s de preparacion. En #779 y
    # #780 el job de py3.11 se cancelo al tocar el limite con el paso de tests ya
    # devuelto en 0.
    # 2026-10-22 (reconciliacion de #778 sobre main): se conservan 70 min, el mayor
    # de los dos valores propuestos, porque las dos mediciones anteriores se tomaron
    # CON la duplicacion push+PR todavia activa (4 jobs Windows compitiendo). Al
    # restringir push a main/master la contencion baja y los tiempos deberian
    # mejorar, no empeorar; 70 min deja el peor caso medido (~40 min) al ~57 %.
    # Bajar el limite ahora seria reintroducir un valor inferior al ya justificado.
    # 2026-11-15: 70 min dejo de alcanzar. Windows py3.11 se cancelo tres veces seguidas
    # al tocar el limite con la suite al 98 % y ningun test fallando (#935 dos veces
    # sobre el mismo head, a los 70 min 16 s; #936 una). La misma suite paso py3.11
    # completa en 56-58 min en otras corridas y py3.12 tarda 50-62 min: el runner lento
    # de py3.11 llega a ~72 min (el peor caso de 2026-10-22 era 2322 s). El agregador
    # `Tests (Pytest)` solo ve el `cancelled` y bloquea el merge de un PR sano. 90 min
    # deja el peor caso extrapolado al ~80 %. El piso esta anclado en
    # tests/test_ci_platform_policy.py (TOPE_MINIMO_DE_LA_MATRIZ_WINDOWS). Ese comentario
    # terminaba diciendo que, si la suite volvia a rozar el limite, el paso siguiente era
    # repartirla en shards en vez de subir el tope otra vez.
    # 2026-11-17: ese paso se dio. Cada shard hace ~1/4 del trabajo (~15-20 min esperados), pero
    # NINGUN shard esta medido todavia en CI, asi que el tope se conserva en 90 a proposito: se baja
    # (y se baja el piso anclado) en un PR aparte y con datos, no por intuicion. El dato que decide es la
    # duracion del JOB entero que muestra Actions (instalacion y coleccion incluidas); el job `test` imprime ademas
    # el tiempo de los TESTS de cada shard (queda en su manifiesto), que sirve para equilibrar el reparto pero NO
    # incluye ni la coleccion ni el arranque, asi que subestima lo que consume el tope.
    # 2026-11-21: ya hay datos de 4 shards (124 jobs exitosos, 2026-11-20/21): el job entero tardo entre 7.8 y 18.0 min.
    # El tope NO se baja en el PR que pasa a 6 shards: se cambia una sola cosa por vez y la siguiente con los datos de 6.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11"]' || '["3.11", "3.12"]') }}
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      # La cobertura se mide aca y se EXIGE en el job `test` sobre los datos combinados de todos los shards:
      # un shard solo cubre una parte de la suite y no puede cumplir el umbral por su cuenta.
      # SIN `shell:`: usa el shell por defecto de Windows (PowerShell), el MISMO que usaba el job unico. La primera
      # version de este paso usaba `bash` y dos tests que asumen un proceso SIN privilegios fallaron con "DID NOT
      # RAISE" (test_tgr_unelevated_without_privilege_fails_closed y test_ns_unelevated_without_privilege_fails_closed,
      # en los shards 2 y 3 de las dos versiones de Python); con PowerShell pasan los 8 shards. Medido: el resultado
      # cambia con el shell; NO se midio por que (el estado del token del proceso es la hipotesis). Esos tests no
      # establecen la condicion que asumen: es una dependencia del entorno a corregir aparte, no se cambia el shell.
      - name: Run test shard
        env:
          SKYCLAW_SHARD: ${{ matrix.shard }}/6
          SKYCLAW_SHARD_MANIFEST: shard-out/shard-manifest.json
          COVERAGE_FILE: shard-out/coverage.sqlite
        run: |
          New-Item -ItemType Directory -Force shard-out | Out-Null
          python -m pytest -p scripts.ci_particion --cov=sky_claw --cov=scripts --cov-report= tests/
      # `if: always()`: aun si un shard falla, sus tiempos y su cobertura sirven para diagnosticar.
      # retention-days: 1: son intermedios que el job `test` consume dentro de la MISMA corrida; no hay motivo
      # para ocupar la cuota de almacenamiento (el job Build ya sube un .exe de ~88 MB por corrida verde).
      # Consecuencia: pasado un dia, «Re-run failed jobs» NO sirve para reintentar solo el veredicto (los shards verdes
      # no se vuelven a correr y sus artefactos ya expiraron: la descarga falla). Para ese caso: «Re-run all jobs», que
      # regenera los 6 artefactos por version de Python.
      # overwrite: true: con `always()` el artefacto queda subido aunque el shard falle, y `upload-artifact` falla por
      # defecto si el nombre ya existe en la corrida: el reintento del mismo shard chocaria con el de su primer intento
      # y quedaria rojo aunque pytest pase. Reemplaza el anterior y el patron de descarga sigue viendo UN artefacto por
      # shard. NO usar un sufijo con run_attempt en el nombre: el patron recogeria el del intento fallido Y el del
      # reintento, y el verificador veria un shard repetido. tests/test_ci_platform_policy.py enumera estas subidas.
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-shard-py${{ matrix.python-version }}-${{ matrix.shard }}
          path: shard-out/
          retention-days: 1
          overwrite: true

  # Veredicto por version de Python: conserva el nombre del check que existia antes del reparto (por si algo
  # lo exigia) y es donde se decide si la suite quedo completa y si la cobertura combinada alcanza el umbral.
  # `!cancelled()` y no el `needs` por defecto: un shard que falla debe dejar ESTE check en rojo, no "skipped"
  # (GitHub da por satisfecho un check requerido que se omitio).
  # Ojo: `needs.test-shard.result` agrega TODA la matriz de shards (las versiones de Python del evento): fuera de un PR,
  # un shard rojo de py3.12 deja rojos ambos veredictos, y ninguno arranca hasta que terminan los 12 shards. No cambia
  # que el merge quede bloqueado; el log del shard que fallo dice cual fue y de que version.
  # La matriz de versiones es la MISMA expresion que la de `test-shard` (hermanos: el ancla exige igualdad textual).
  test:
    name: "🧪 Tests / ${{ matrix.os }} / py${{ matrix.python-version }}"
    needs: [test-shard]
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11"]' || '["3.11", "3.12"]') }}
    steps:
      - name: Require every shard to have passed
        shell: bash
        run: |
          if [[ "${{ needs.test-shard.result }}" != "success" ]]; then
            echo "Test shards failed: ${{ needs.test-shard.result }}"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      # SHA resuelto contra el upstream (refs/tags/v7.0.0 de actions/download-artifact); misma major que
      # el upload-artifact@v7 que ya usa este repo.
      - name: Download shard results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-shard-py${{ matrix.python-version }}-*
          path: shards
      # `--con-cobertura`: `coverage combine` sobre un glob al que le falta una base NO falla; combina las que hay y,
      # si esas alcanzan el umbral, el job queda verde con una cobertura parcial. El verificador exige las 6 bases.
      - name: Verify shard completeness
        shell: bash
        run: python -m scripts.ci_particion verificar shards --total 6 --con-cobertura
      # Los datos de cada shard ya incluyen los modulos no ejecutados (coverage los registra al guardar), asi
      # que combinarlos da el mismo total que una corrida unica: la union de lo ejecutado por los 6 shards.
      # `xml` ANTES de `report --fail-under`: el umbral hace salir con error al `report` y el paso se corta ahi; con
      # el XML ya escrito, el artefacto `coverage-report-*` permite ver que lineas no se cubren cuando el umbral falla.
      - name: Combine coverage and enforce threshold
        shell: bash
        run: |
          python -m coverage combine shards/*/coverage.sqlite
          python -m coverage xml
          python -m coverage report --fail-under=60
      # overwrite: true por lo mismo que la subida de los shards: `always()` + nombre fijo + reintento del veredicto.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          overwrite: true

  # Linux/WSL2 ejecuta parte del core async, pero no es plataforma de entrega.
  # Esta señal POSIX es informativa y deliberadamente menor que la suite Windows.
  test-posix-core:
    name: "🧪 POSIX Core / py3.11"
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup_python_posix
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Run POSIX core tests
        id: run_posix_tests
        run: |
          python -m pytest -q \
            tests/test_path_validator.py \
            tests/test_preflight_wiring.py \
            tests/test_dyndolod_uia_preflight.py::test_el_observador_por_defecto_falla_cerrado_en_vez_de_adivinar \
            tests/test_dyndolod_uia_preflight.py::test_el_pipeline_con_el_observador_por_defecto_da_unknown_no_error \
            tests/test_dyndolod_uia_preflight.py::test_uia_no_disponible_es_un_error_uia \
            tests/test_dyndolod_uia_preflight.py::test_el_modulo_no_importa_nada_de_windows \
            tests/test_frozen_runtime_p4_root_lock.py \
            tests/test_etapa6_testigo_durable.py

  # ── Gate 4: Security ────────────────────────────────────────────
  security:
    name: "🛡️ Security Scan"
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install security tools + project
        run: |
          pip install -e .
          pip install bandit pip-audit setuptools
      - name: Bandit (SAST)
        run: bandit -r sky_claw/ scripts/ -ll
      - name: Verify lockfile install (hash enforced)
        run: |
          python -m venv .lock-venv
          .\.lock-venv\Scripts\python -m pip install --upgrade pip
          .\.lock-venv\Scripts\python -m pip install --require-hashes -r requirements.lock
      - name: Pip-audit (SCA — strict)
        run: pip-audit --strict --skip-editable -r requirements.lock
      # ADR 0014 (decisión 3): el extra opcional native-parallax lleva numpy y Pillow, que
      # requirements.lock NO fija (el runtime base no cambia). Su lock propio se instala con hashes y se
      # audita aparte; tests/test_native_parallax_producto_invariant.py exige que estos dos pasos existan.
      - name: Verify native-parallax extra lockfile install (hash enforced)
        run: |
          python -m venv .lock-venv-np
          .\.lock-venv-np\Scripts\python -m pip install --upgrade pip
          .\.lock-venv-np\Scripts\python -m pip install --require-hashes -r requirements-native-parallax.lock
      - name: Pip-audit native-parallax extra (SCA — strict)
        run: pip-audit --strict --skip-editable -r requirements-native-parallax.lock
      # PR-LIC-03B (B09): el toolchain de build se fija con hashes y se audita en CI igual que runtime.
      - name: Verify build toolchain lockfile install (hash enforced)
        run: |
          python -m venv .lock-venv-build
          .\.lock-venv-build\Scripts\python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements-build.lock
      - name: Pip-audit build toolchain (SCA — strict)
        run: pip-audit --strict --skip-editable -r requirements-build.lock
      # P0.5 — Node gateway supply-chain audit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: NPM ci (Telegram gateway)
        working-directory: sky_claw/app/comms/telegram_gateway_node
        run: npm ci
      - name: Test agent reconnect (Telegram gateway)
        working-directory: sky_claw/app/comms/telegram_gateway_node
        run: node --test tests/test_agent_reconnect.js
      - name: NPM audit (Telegram gateway)
        working-directory: sky_claw/app/comms/telegram_gateway_node
        run: npm audit --audit-level=high

  # ── Summary jobs: exact names required by branch protection ──────────────
  # Branch protection requires single-name checks; matrix produces /py3.11
  # variants.  These fan-in jobs re-publish a result under the protected names
  # so the gate is satisfied without changing branch protection settings.

  lint-summary:
    name: "🔍 Lint (Ruff)"
    needs: [lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check lint matrix result
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint matrix failed: ${{ needs.lint.result }}"
            exit 1
          fi

  typecheck-summary:
    name: "🏷️ Type Check (Mypy)"
    needs: [typecheck]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check typecheck matrix result
        run: |
          if [[ "${{ needs.typecheck.result }}" != "success" ]]; then
            echo "Typecheck matrix failed: ${{ needs.typecheck.result }}"
            exit 1
          fi

  test-summary:
    name: "🧪 Tests (Pytest)"
    needs: [test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test matrix result
        run: |
          # Runtime tests are Windows-only; any matrix failure is a hard blocker.
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test matrix failed: ${{ needs.test.result }}"
            exit 1
          fi

  # ── Gate 5: Build ──────────────────────────────────────────────
  build:
    name: "📦 Build"
    needs: [lint-summary, typecheck-summary, test-summary, security]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies (isolated, hash-enforced)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $venvDir = Join-Path $env:RUNNER_TEMP 'skyclaw-build-venv'
          python scripts/build_controlado.py --prepare-venv $venvDir --profile base --env-out dist/build-evidence/build_env.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build executable
        id: build_executable
        shell: pwsh
        env:
          SKYCLAW_EXPORT_ANALYSIS_TOC: dist/build-evidence/analysis_toc.json
          PYTHONNOUSERSITE: "1"
          PIP_CONFIG_FILE: NUL
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Get-ChildItem Env:PIP_* | Remove-Item -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONPATH, Env:PYTHONHOME, Env:PYTHONSTARTUP -ErrorAction SilentlyContinue
          $venvDir = Join-Path $env:RUNNER_TEMP 'skyclaw-build-venv'
          $env:PATH = "$venvDir\Scripts;$env:PATH"
          pyinstaller sky_claw.spec --clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record SHA-256 of frozen executable
        run: python scripts/registrar_sha256_ejecutable.py registrar dist/SkyClawApp.exe --json dist/build-evidence/exe_sha256.json
      - name: Smoke-test frozen executable
        id: smoke_frozen_executable
        run: python scripts/smoke_frozen_executable.py dist/SkyClawApp.exe
      - name: Inventory and reconcile frozen executable (PR-LIC-03A/B)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $venvDir = Join-Path $env:RUNNER_TEMP 'skyclaw-build-venv'
          $venvPy = Join-Path $venvDir 'Scripts\python.exe'
          $pyVer = & $venvPy -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_controlado.py --sanitize-toc dist/build-evidence/analysis_toc.json --validate-venv $venvDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $venvPy scripts/inventario_ejecutable.py dist/SkyClawApp.exe --out dist/build-evidence/inventory.json --registro-sha256 dist/build-evidence/exe_sha256.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $PSNativeCommandUseErrorActionPreference = $false
          & $venvPy scripts/reconciliar_sbom.py --inventory dist/build-evidence/inventory.json --env-json dist/build-evidence/build_env.json --analysis-toc-json dist/build-evidence/analysis_toc.json --build-python-version $pyVer --lockfile requirements.lock --check-spec-datas --sbom-out dist/build-evidence/sbom.spdx.json --report-out dist/build-evidence/reconciliation_report.json
          $recExit = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          if ($recExit -ne 0 -and $recExit -ne 1) { exit $recExit }
          python scripts/build_controlado.py --verify-report dist/build-evidence/reconciliation_report.json --profile base --exe dist/SkyClawApp.exe --exe-sha256-json dist/build-evidence/exe_sha256.json --validate-venv $venvDir --analysis-toc dist/build-evidence/analysis_toc.json --sbom dist/build-evidence/sbom.spdx.json --smoke-outcome "${{ steps.smoke_frozen_executable.outcome }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # PR-LIC-03B (B15 — Opción B ampliada): publicación de SkyClawApp.exe vía Actions suspendida
      # temporalmente en TODOS los eventos (pull_request, push, schedule, workflow_dispatch) mientras
      # permanezcan abiertos los bloqueos jurídicos de distribución. Su reactivación corresponde a
      # PR-LIC-04 y requiere aprobación explícita del propietario. Ancla: tests/test_release_smoke_wiring.py.
      - name: Upload frozen executable (suspended until PR-LIC-04)
        if: ${{ false }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SkyClawApp-exe
          path: dist/SkyClawApp.exe

  # ── Alerta: main roto ────────────────────────────────────────────
  # Fuera de un PR (push, nocturna, a pedido) y solo sobre main: si CUALQUIER job no informativo falló, abre el issue
  # «CI de main roto» o comenta el que ya está abierto (scripts/ci_alerta_main.py). Sin esto, una regresión que solo
  # aparece en py3.12 (que los PRs ya no corren) sería una cruz roja en un commit que nadie mira.
  # `failure()` mira a TODOS los ancestros, no solo a los `needs` directos: con estos cinco cuelgan todos los jobs salvo
  # `test-posix-core`, que es informativo (continue-on-error). tests/test_ci_platform_policy.py lo enumera.
  # Es el ÚNICO job con permiso de escritura, y solo sobre issues. Los datos entran por env, nunca por ${{ }} en `run`.
  alerta-main:
    name: "🚨 Alerta: main roto"
    needs: [lint-summary, typecheck-summary, test-summary, security, build]
    if: ${{ failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    # Exclusión entre corridas: buscar el issue y crearlo no es atómico, y dos corridas de main que fallan a la vez
    # (push + nocturna, dos SHAs distintos) verían «no hay issue» las dos y abrirían dos. Un grupo fijo serializa las
    # alertas de TODAS las corridas; sin cancelar, la segunda espera y comenta el issue que abrió la primera.
    # `queue: max`: con el default (`single`) cabe una sola pendiente y una tercera corrida la cancelaría
    # (`cancel-in-progress: false` solo protege a la que ya corre); así cada corrida rota deja su comentario.
    concurrency:
      group: alerta-main-roto
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Abrir o comentar el issue de main roto
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENTO: ${{ github.event_name }}
          COMMIT: ${{ github.sha }}
          URL_DE_LA_CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci_alerta_main.py
