name: Sky-Claw CI/CD

on:
  # Solo main/master en push: las ramas feat/fix/etc. con PR disparaban la matriz
  # completa dos veces (push + pull_request) porque concurrency usa github.ref
  # (refs/heads vs refs/pull/N/merge) y no se cancelan entre sí. Con 2 Pythons
  # eso eran 4 jobs Windows de ~35-40 min compitiendo por runners y cancelándose
  # por timeout. El control que importa (incluido el revisor adversarial) corre
  # en pull_request. Ramas sin PR no corren CI hasta abrir el PR.
  push:
    branches: [main, master]
  # pull_request sin filtro de branches: corre en todo PR, incluyendo stacked
  # (base = feature branch). Como push ya no dispara en feature, no hay
  # duplicación. Cubre el caso señalado en revisión (PR a feature sin CI).
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI-FIX-001: Opt into Node.js 24 now — Node.js 20 actions are deprecated
# and will be forced off on 2026-06-02 and removed 2026-09-16.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Gate 1: Code Quality ─────────────────────────────────────
  lint:
    name: "🔍 Lint (Ruff) / py${{ matrix.python-version }}"
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # CI-FIX-002: Install ruff via dev extras for version consistency with
      # local dev environment. Avoids silent format drift caused by unpinned
      # `pip install ruff` resolving to a different minor/patch than local.
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check sky_claw/ scripts/ tests/ --output-format=github
      - name: Ruff format check
        run: ruff format --check sky_claw/ scripts/ tests/

  # ── Gate 2: Type Safety ───────────────────────────────────────
  typecheck:
    name: "🏷️ Type Check (Mypy) / py${{ matrix.python-version }}"
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Mypy check
        run: python -m mypy sky_claw/ scripts/ --ignore-missing-imports --no-error-summary

  # ── Gate 3: Test Suite ───────────────────────────────────────
  test:
    name: "🧪 Tests / ${{ matrix.os }} / py${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    # 2026-10-22: suite creció. En PR #777 (commit 073053c0):
    # - push: py3.11 paso tests 37 min 47 s, job 39 min 20 s; py3.12 ~35 min.
    # - pull_request: py3.11 cancelado a 40 min 6 s.
    # Duplicación push+PR + 2 Pythons = 4 jobs Windows compitiendo. Con push
    # restringido a main/master la carga baja. 70 min deja el peor caso medido
    # (~40 min) al ~57 % y da margen real >40 % ante variabilidad de runners.
    # No se bajó --cov-fail-under ni se deshabilitaron tests.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest --cov=sky_claw --cov=scripts --cov-report=xml --cov-fail-under=60 tests/
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml

  # Linux/WSL2 ejecuta parte del core async, pero no es plataforma de entrega.
  # Esta señal POSIX es informativa y deliberadamente menor que la suite Windows.
  test-posix-core:
    name: "🧪 POSIX Core / py3.11"
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup_python_posix
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Run POSIX core tests
        id: run_posix_tests
        run: |
          python -m pytest -q \
            tests/test_path_validator.py \
            tests/test_preflight_wiring.py \
            tests/test_dyndolod_uia_preflight.py::test_el_observador_por_defecto_falla_cerrado_en_vez_de_adivinar \
            tests/test_dyndolod_uia_preflight.py::test_el_pipeline_con_el_observador_por_defecto_da_unknown_no_error \
            tests/test_dyndolod_uia_preflight.py::test_uia_no_disponible_es_un_error_uia \
            tests/test_dyndolod_uia_preflight.py::test_el_modulo_no_importa_nada_de_windows \
            tests/test_frozen_runtime_p4_root_lock.py

  # ── Gate 4: Security ────────────────────────────────────────────
  security:
    name: "🛡️ Security Scan"
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install security tools + project
        run: |
          pip install -e .
          pip install bandit pip-audit setuptools
      - name: Bandit (SAST)
        run: bandit -r sky_claw/ scripts/ -ll
      - name: Verify lockfile install (hash enforced)
        run: |
          python -m venv .lock-venv
          .\.lock-venv\Scripts\python -m pip install --upgrade pip
          .\.lock-venv\Scripts\python -m pip install --require-hashes -r requirements.lock
      - name: Pip-audit (SCA — strict)
        run: pip-audit --strict --skip-editable -r requirements.lock
      # ADR 0014 (decisión 3): el extra opcional native-parallax lleva numpy y Pillow, que
      # requirements.lock NO fija (el runtime base no cambia). Su lock propio se instala con hashes y se
      # audita aparte; tests/test_native_parallax_producto_invariant.py exige que estos dos pasos existan.
      - name: Verify native-parallax extra lockfile install (hash enforced)
        run: |
          python -m venv .lock-venv-np
          .\.lock-venv-np\Scripts\python -m pip install --upgrade pip
          .\.lock-venv-np\Scripts\python -m pip install --require-hashes -r requirements-native-parallax.lock
      - name: Pip-audit native-parallax extra (SCA — strict)
        run: pip-audit --strict --skip-editable -r requirements-native-parallax.lock
      # P0.5 — Node gateway supply-chain audit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: NPM ci (Telegram gateway)
        working-directory: sky_claw/app/comms/telegram_gateway_node
        run: npm ci
      - name: NPM audit (Telegram gateway)
        working-directory: sky_claw/app/comms/telegram_gateway_node
        run: npm audit --audit-level=high

  # ── Summary jobs: exact names required by branch protection ──────────────
  # Branch protection requires single-name checks; matrix produces /py3.11
  # variants.  These fan-in jobs re-publish a result under the protected names
  # so the gate is satisfied without changing branch protection settings.

  lint-summary:
    name: "🔍 Lint (Ruff)"
    needs: [lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check lint matrix result
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint matrix failed: ${{ needs.lint.result }}"
            exit 1
          fi

  typecheck-summary:
    name: "🏷️ Type Check (Mypy)"
    needs: [typecheck]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check typecheck matrix result
        run: |
          if [[ "${{ needs.typecheck.result }}" != "success" ]]; then
            echo "Typecheck matrix failed: ${{ needs.typecheck.result }}"
            exit 1
          fi

  test-summary:
    name: "🧪 Tests (Pytest)"
    needs: [test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test matrix result
        run: |
          # Runtime tests are Windows-only; any matrix failure is a hard blocker.
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test matrix failed: ${{ needs.test.result }}"
            exit 1
          fi

  # ── Gate 5: Build ──────────────────────────────────────────────
  build:
    name: "📦 Build"
    needs: [lint-summary, typecheck-summary, test-summary, security]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: |
          pip install pyinstaller
          pip install -e .
      - name: Build executable
        id: build_executable
        run: pyinstaller sky_claw.spec --clean
      - name: Smoke-test frozen executable
        id: smoke_frozen_executable
        run: python scripts/smoke_frozen_executable.py dist/SkyClawApp.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SkyClawApp-exe
          path: dist/SkyClawApp.exe
