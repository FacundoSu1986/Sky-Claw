name: tmp debug PR908

# Workflow TEMPORAL de diagnóstico (se elimina antes del merge).
# Motivo: los logs de los jobs de CI no son legibles desde el entorno del agente
# (viven en un blob host no accesible), pero los comentarios del PR sí. Por eso el
# resultado de pytest se publica como comentario en el PR #908.

on:
  push:
    branches: [arena/bb4f2e9a-sky-claw]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  solo-pr3:
    name: "diagnostico / archivo PR3"
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: pytest archivo PR3
        shell: pwsh
        run: |
          python -m pytest tests/test_frozen_runtime_p7_a5_pr3_hitl_wiring.py -q --timeout=180 --tb=short -rf 2>&1 | Tee-Object -FilePath pr3.txt
          $code = $LASTEXITCODE
          "exit=$code" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content pr3.txt | Select-Object -Last 400 | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $code
      - name: publicar diagnóstico
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $texto = (Get-Content pr3.txt -Raw)
          if ($texto.Length -gt 12000) { $texto = $texto.Substring($texto.Length - 12000) }
          $json = ConvertTo-Json @{ body = "### diag PR3 (windows-latest py3.12)`n``````text`n$texto`n``````" } -Depth 5
          [System.IO.File]::WriteAllText("$PWD/payload.json", $json)
          gh api "repos/${{ github.repository }}/issues/908/comments" --method POST --input payload.json

  suite-completa:
    name: "diagnostico / suite completa"
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: pytest suite completa
        shell: pwsh
        run: |
          python -m pytest tests/ -q --timeout=180 --tb=no -rf 2>&1 | Tee-Object -FilePath full.txt
          $code = $LASTEXITCODE
          "exit=$code" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content full.txt | Select-Object -Last 400 | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $code
      - name: publicar diagnóstico
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $texto = (Get-Content full.txt -Raw)
          if ($texto.Length -gt 20000) { $texto = $texto.Substring($texto.Length - 20000) }
          $json = ConvertTo-Json @{ body = "### diag suite completa (windows-latest py3.12)`n``````text`n$texto`n``````" } -Depth 5
          [System.IO.File]::WriteAllText("$PWD/payload2.json", $json)
          gh api "repos/${{ github.repository }}/issues/908/comments" --method POST --input payload2.json
